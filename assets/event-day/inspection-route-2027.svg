<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 720" width="980" height="720" font-family="'Noto Sans TC','PingFang TC','Microsoft JhengHei',sans-serif">
  <defs>
    <marker id="redArrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker>
    <marker id="yellowArrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#ca8a04"/></marker>
    <marker id="greenArrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#059669"/></marker>
  </defs>

  <rect width="980" height="720" fill="#f8fafc"/>
  <rect x="14" y="14" width="952" height="692" rx="18" fill="#ffffff" stroke="#cbd5e1"/>

  <text x="40" y="52" font-size="23" font-weight="700" fill="#0f172a">港島童軍繽紛日 2026 — 會操檢閱路線</text>
  <text x="40" y="78" font-size="14" fill="#475569">主禮嘉賓：香港警務處港島總區指揮官 區永樑先生　｜　4.10.2026　香港警察學院大操場</text>
  <rect x="40" y="90" width="330" height="26" rx="13" fill="#fee2e2" stroke="#fecaca"/>
  <text x="54" y="108" font-size="13" font-weight="700" fill="#b91c1c">今次修改：檢閱路線加入「行埋地域旗隊」</text>

  <!-- 樂隊 -->
  <rect x="70" y="140" width="560" height="46" rx="10" fill="#ede9fe" stroke="#c4b5fd"/>
  <text x="350" y="169" font-size="15" font-weight="700" fill="#5b21b6" text-anchor="middle">樂　隊</text>

  <!-- 第二組群隊伍 -->
  <rect x="70" y="204" width="560" height="112" rx="10" fill="#e0f2fe" stroke="#7dd3fc"/>
  <text x="84" y="226" font-size="14" font-weight="700" fill="#075985">第二組群隊伍（只檢閱每個 Row 嘅 Front Rank）</text>
  <g fill="#38bdf8">
    <rect x="96" y="236" width="500" height="14" rx="7" opacity="0.85"/>
    <rect x="96" y="258" width="500" height="14" rx="7" opacity="0.5"/>
    <rect x="96" y="280" width="500" height="14" rx="7" opacity="0.85"/>
  </g>
  <text x="608" y="248" font-size="11" fill="#0369a1" text-anchor="end">Front Rank</text>

  <!-- 第一組群隊伍 -->
  <rect x="70" y="334" width="560" height="112" rx="10" fill="#dcfce7" stroke="#86efac"/>
  <text x="84" y="356" font-size="14" font-weight="700" fill="#166534">第一組群隊伍（只檢閱每個 Row 嘅 Front Rank）</text>
  <g fill="#4ade80">
    <rect x="96" y="366" width="500" height="14" rx="7" opacity="0.9"/>
    <rect x="96" y="388" width="500" height="14" rx="7" opacity="0.55"/>
    <rect x="96" y="410" width="500" height="14" rx="7" opacity="0.9"/>
  </g>
  <text x="608" y="378" font-size="11" fill="#15803d" text-anchor="end">Front Rank</text>

  <!-- 旗隊 -->
  <rect x="190" y="470" width="320" height="86" rx="10" fill="#fef9c3" stroke="#fde047"/>
  <text x="350" y="492" font-size="14" font-weight="700" fill="#854d0e" text-anchor="middle">地域旗隊（新增檢閱）</text>
  <rect x="214" y="500" width="272" height="14" rx="7" fill="#facc15"/>
  <text x="500" y="512" font-size="11" fill="#854d0e" text-anchor="end">Rear Rank</text>
  <rect x="214" y="528" width="272" height="14" rx="7" fill="#eab308"/>
  <text x="500" y="540" font-size="11" fill="#854d0e" text-anchor="end">Front Rank</text>

  <!-- 檢閱台 -->
  <rect x="250" y="600" width="200" height="54" rx="10" fill="#1e293b"/>
  <text x="350" y="633" font-size="16" font-weight="700" fill="#ffffff" text-anchor="middle">檢 閱 台</text>

  <!-- 紅線：出發 → 旗隊（新增段） -->
  <path d="M450 626 L560 626 L560 535 L500 535" fill="none" stroke="#dc2626" stroke-width="4" marker-end="url(#redArrow)"/>
  <path d="M496 535 L206 535" fill="none" stroke="#dc2626" stroke-width="4" marker-end="url(#redArrow)"/>
  <path d="M200 528 L200 507 L214 507" fill="none" stroke="#dc2626" stroke-width="4"/>
  <path d="M214 507 L496 507" fill="none" stroke="#dc2626" stroke-width="4" marker-end="url(#redArrow)"/>
  <!-- 紅線：旗隊 → 第一組群起點 -->
  <path d="M500 500 L540 500 L540 460 L80 460 L80 373 L94 373" fill="none" stroke="#dc2626" stroke-width="4" marker-end="url(#redArrow)"/>

  <!-- 黃線：檢閱兩個組群（蛇形） -->
  <path d="M96 373 L600 373" fill="none" stroke="#ca8a04" stroke-width="5" marker-end="url(#yellowArrow)"/>
  <path d="M604 373 L646 373 L646 243 L604 243" fill="none" stroke="#ca8a04" stroke-width="5"/>
  <path d="M604 243 L96 243" fill="none" stroke="#ca8a04" stroke-width="5" marker-end="url(#yellowArrow)"/>

  <!-- 綠線：經樂隊前方回檢閱台 -->
  <path d="M92 243 L50 243 L50 680 L350 680 L350 658" fill="none" stroke="#059669" stroke-width="4" stroke-dasharray="10 7" marker-end="url(#greenArrow)"/>

  <!-- 右欄說明 -->
  <rect x="674" y="140" width="268" height="176" rx="12" fill="#f1f5f9" stroke="#cbd5e1"/>
  <text x="692" y="166" font-size="14" font-weight="700" fill="#0f172a">圖例</text>
  <line x1="692" y1="186" x2="730" y2="186" stroke="#dc2626" stroke-width="4"/>
  <text x="740" y="191" font-size="12" fill="#334155">紅線＝新增：行埋地域旗隊</text>
  <line x1="692" y1="214" x2="730" y2="214" stroke="#ca8a04" stroke-width="5"/>
  <text x="740" y="219" font-size="12" fill="#334155">黃線＝檢閱行進方向</text>
  <line x1="692" y1="242" x2="730" y2="242" stroke="#059669" stroke-width="4" stroke-dasharray="8 6"/>
  <text x="740" y="247" font-size="12" fill="#334155">綠線＝回程／離場</text>
  <text x="692" y="276" font-size="12" fill="#334155">同行：檢閱官 ＋ 兩位陪同總監</text>
  <text x="692" y="296" font-size="12" fill="#334155">　　　＋ 會操司令員</text>

  <rect x="674" y="334" width="268" height="150" rx="12" fill="#fff7ed" stroke="#fed7aa"/>
  <text x="692" y="360" font-size="14" font-weight="700" fill="#9a3412">檢閱官會問隊員</text>
  <text x="692" y="386" font-size="12" fill="#7c2d12">1. 你加入左童軍幾耐啊？</text>
  <text x="692" y="410" font-size="12" fill="#7c2d12">2. 今天辛吾辛苦啊？</text>
  <text x="692" y="434" font-size="12" fill="#7c2d12">3. 你係屬於童軍邊個單位？</text>
  <text x="692" y="462" font-size="11" fill="#9a3412">檢閱完畢：會操司令員向檢閱官敬禮</text>

  <rect x="674" y="500" width="268" height="154" rx="12" fill="#eff6ff" stroke="#bfdbfe"/>
  <text x="692" y="526" font-size="14" font-weight="700" fill="#1e3a8a">次序</text>
  <text x="692" y="550" font-size="12" fill="#1e40af">① 檢閱台 → 旗隊 Front Rank</text>
  <text x="692" y="572" font-size="12" fill="#1e40af">② 旗隊 Rear Rank（新增）</text>
  <text x="692" y="594" font-size="12" fill="#1e40af">③ 第一組群（左 → 右）</text>
  <text x="692" y="616" font-size="12" fill="#1e40af">④ 第二組群（右 → 左）</text>
  <text x="692" y="638" font-size="12" fill="#1e40af">⑤ 經樂隊前方回檢閱台</text>

  <text x="40" y="700" font-size="11" fill="#94a3b8">港島童軍繽紛日 2026｜會操檢閱路線</text>
</svg>
