<!doctype html>
<html lang="zh-HK">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>2027 活動申報</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 text-slate-800">
  <main class="max-w-2xl mx-auto p-4 sm:p-8">
    <div class="bg-white rounded-2xl shadow p-5 sm:p-8">
      <div class="text-xs text-slate-500 mb-2">香港童軍繽紛日 2027</div>
      <h1 class="text-2xl font-black mb-2">旅團／單位申報</h1>
      <p class="text-sm text-slate-600 mb-4">此頁保留未來受控報名入口的欄位設計。所有真實申報必須先進入對應的 2027-owned `IN…` source record，再由已核准 owner 發佈；不會寫入 2026 系統。</p>
      <div id="framework-notice" class="rounded-xl border border-amber-200 bg-amber-50 p-3 text-sm text-amber-900 mb-6">
        2027 受控申報入口尚未啟用，請勿在此頁提交真實資料。
      </div>
      <form id="intake" class="space-y-4">
        <fieldset disabled id="intake-fields" class="space-y-4 opacity-60">
          <div>
            <label class="block text-sm font-bold mb-1">申報類別</label>
            <select id="kind" class="w-full border rounded-xl p-3">
              <option value="participants">旅團報名／出席</option>
              <option value="merit_attendance">優異旅團出席</option>
              <option value="meal_box">膳食餐盒訂購</option>
              <option value="transport">旅遊巴／交通</option>
              <option value="booth">攤位參加</option>
            </select>
          </div>
          <div class="grid sm:grid-cols-2 gap-3">
            <div><label class="block text-sm font-bold mb-1">旅團／單位名稱 *</label><input id="unit_name" required class="w-full border rounded-xl p-3"></div>
            <div><label class="block text-sm font-bold mb-1">聯絡人 *</label><input id="contact_name" required class="w-full border rounded-xl p-3"></div>
            <div><label class="block text-sm font-bold mb-1">電話／電郵</label><input id="contact" class="w-full border rounded-xl p-3"></div>
            <div><label class="block text-sm font-bold mb-1">預計人數</label><input id="headcount" type="number" min="0" class="w-full border rounded-xl p-3"></div>
          </div>
          <div><label class="block text-sm font-bold mb-1">申報內容／備註</label><textarea id="details" rows="6" class="w-full border rounded-xl p-3"></textarea></div>
        </fieldset>
        <div id="status" class="text-sm"></div>
        <button type="submit" class="w-full bg-slate-400 text-white rounded-xl p-3 font-bold cursor-not-allowed">等待 2027 受控入口啟用</button>
      </form>
    </div>
  </main>
  <script>
    // Deliberately no 2027 GAS URL or API key is loaded into this public page.
    // A future authenticated server-side intake route will map each form to the
    // matching IN… canonical source record after owner/approval rules are live.
    document.getElementById('intake').addEventListener('submit', function (event) {
      event.preventDefault();
      const status=document.getElementById('status');
      status.textContent='2027 受控申報入口尚未啟用；請等待已核准的正式連結。';
      status.className='text-sm text-amber-800 font-bold';
    });
  </script>
</body>
</html>
