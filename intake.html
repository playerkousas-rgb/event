<!doctype html><html lang="zh-HK"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>2027 活動申報</title><script src="https://cdn.tailwindcss.com"></script></head><body class="bg-slate-50 text-slate-800"><main class="max-w-2xl mx-auto p-4 sm:p-8"><div class="bg-white rounded-2xl shadow p-5 sm:p-8"><div class="text-xs text-slate-500 mb-2">香港童軍繽紛日 2027</div><h1 class="text-2xl font-black mb-2">旅團／單位申報</h1><p class="text-sm text-slate-600 mb-6">請直接填寫及提交。資料會寫入活動 Main Sheet，籌委確認或修正後會保留修改紀錄。</p><form id="intake" class="space-y-4"><div><label class="block text-sm font-bold mb-1">申報類別</label><select id="kind" class="w-full border rounded-xl p-3"><option value="participants">旅團報名／出席</option><option value="merit_attendance">優異旅團出席</option><option value="meal_box">膳食餐盒訂購</option><option value="transport">旅遊巴／交通</option><option value="booth">攤位參加</option></select></div><div class="grid sm:grid-cols-2 gap-3"><div><label class="block text-sm font-bold mb-1">旅團／單位名稱 *</label><input id="unit_name" required class="w-full border rounded-xl p-3"></div><div><label class="block text-sm font-bold mb-1">聯絡人 *</label><input id="contact_name" required class="w-full border rounded-xl p-3"></div><div><label class="block text-sm font-bold mb-1">電話／電郵</label><input id="contact" class="w-full border rounded-xl p-3"></div><div><label class="block text-sm font-bold mb-1">預計人數</label><input id="headcount" type="number" min="0" class="w-full border rounded-xl p-3"></div></div><div><label class="block text-sm font-bold mb-1">申報內容／備註</label><textarea id="details" rows="6" class="w-full border rounded-xl p-3"></textarea></div><div id="status" class="text-sm"></div><button class="w-full bg-indigo-600 text-white rounded-xl p-3 font-bold">提交申報</button></form></div></main><script>
const CFG={event_id:'isd_2027',gas_url:'',api_key:''};
async function config(){try{const r=await fetch('/api/config');const j=await r.json();CFG.gas_url=j.gasUrl2027||'';CFG.api_key=j.apiKey2027||'';}catch(e){}}
function val(id){return document.getElementById(id).value.trim()}
document.getElementById('intake').onsubmit=async e=>{e.preventDefault();const s=document.getElementById('status');s.textContent='提交中…';s.className='text-sm text-slate-500';await config();const record={id:'intake_'+Date.now(),event_id:CFG.event_id||'isd_2027',submission_type:val('kind'),unit_name:val('unit_name'),contact_name:val('contact_name'),contact:val('contact'),headcount:val('headcount'),details:val('details'),submitted_by:val('contact_name'),updated_by:'public_intake',updated_at:new Date().toISOString(),status:'submitted'};try{if(!CFG.gas_url)throw Error('申報服務尚未設定');const r=await fetch(CFG.gas_url,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({action:'saveBatchRecords',api_key:CFG.api_key,records:[{module:'Public_2027_Intake',record}]})});const j=await r.json();if(!j.success)throw Error(j.error||'提交失敗');s.textContent='已提交，請保留本頁確認。';s.className='text-sm text-emerald-700 font-bold';e.target.reset()}catch(err){s.textContent='未能提交：'+err.message;s.className='text-sm text-rose-700 font-bold'}};
</script></body></html>
